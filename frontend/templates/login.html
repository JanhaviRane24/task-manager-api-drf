{%extends 'base.html'%}
{% block title %}Login{% endblock %}
{% block content %}

<div class="relative grid min-h-screen grid-cols-[1fr_2.5rem_auto_2.5rem_1fr] grid-rows-[1fr_auto_1fr]">

    <div class="col-start-3 row-start-2 bg-gray-100 rounded-xl p-8 shadow-lg w-full max-w-md">

        <h1 class="text-3xl font-light text-center mb-6">
            Login to your account
        </h1>
        {%if form.non_field_errors%}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
            <strong class="font-bold">Error!</strong>
            <span class="block sm:inline">{{ form.non_field_errors }}</span>
        </div>
        {% endif %}

        <form method="post" class="bg-white rounded-lg shadow-md overflow-hidden">

            {% csrf_token %}

            <div class="h-2 bg-indigo-500"></div>

            <div class="p-8">

                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                    class="w-full border border-gray-300 rounded-md px-3 py-2 mb-5 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >

                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >

                <div class="flex justify-between items-center mt-6">

                    <button
                        type="submit"
                        class="bg-indigo-500 text-white px-6 py-2 rounded-md hover:bg-indigo-600 transition">
                        Login
                    </button>

                    <p class="text-center text-sm text-gray-600 mt-1 px-2">
                  Create a new account
                    <a href="{% url 'register' %}" class="text-indigo-600 hover:underline">
                        Register
                    </a>
                </p>

                </div>

            </div>

        </form>

    </div>

</div>


{% endblock %}>
