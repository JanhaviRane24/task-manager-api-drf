{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="min-h-screen flex items-center justify-center bg-gray-100 p-8">

    <div class="w-full max-w-lg">

        <h1 class="text-3xl font-light text-center mb-6">
            Edit Task
        </h1>

        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <form method="POST" action="{% url 'update_task' task.id %}">
                {% csrf_token %}

                <div class="h-2 bg-indigo-500"></div>

                <div class="p-8 space-y-5">

                    <div>
                        <label for="title" class="block text-sm font-semibold text-gray-700 mb-2">
                            Title
                        </label>
                        <input
                            type="text"
                            id="title"
                            name="title"
                            value="{{ task.title }}"
                            required
                            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <div>
                        <label for="description" class="block text-sm font-semibold text-gray-700 mb-2">
                            Description
                        </label>
                        <textarea
                            id="description"
                            name="description"
                            rows="4"
                            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">{{ task.description }}</textarea>
                    </div>

                    <div>
                        <label for="status" class="block text-sm font-semibold text-gray-700 mb-2">
                            Status
                        </label>
                        <select
                            id="status"
                            name="status"
                            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="pending" {% if task.status == "pending" %}selected{% endif %}>Pending</option>
                            <option value="in_progress" {% if task.status == "in_progress" %}selected{% endif %}>In Progress</option>
                            <option value="completed" {% if task.status == "completed" %}selected{% endif %}>Completed</option>
                        </select>
                    </div>

                    <div>
                        <label for="priority" class="block text-sm font-semibold text-gray-700 mb-2">
                            Priority
                        </label>
                        <select
                            id="priority"
                            name="priority"
                            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="low" {% if task.priority == "low" %}selected{% endif %}>Low</option>
                            <option value="medium" {% if task.priority == "medium" %}selected{% endif %}>Medium</option>
                            <option value="high" {% if task.priority == "high" %}selected{% endif %}>High</option>
                        </select>
                    </div>

                    <div>
                        <label for="due_date" class="block text-sm font-semibold text-gray-700 mb-2">
                            Due Date
                        </label>
                        <input
                            type="date"
                            id="due_date"
                            name="due_date"
                            value="{{ task.due_date|date:'Y-m-d' }}"
                            class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <button
                        type="submit"
                        class="w-full bg-indigo-500 text-white py-2 rounded-md hover:bg-indigo-600 transition">
                        Update Task
                    </button>

                </div>
            </form>
        </div>

    </div>
</div>

{% endblock %}
