{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="relative grid min-h-screen grid-cols-[1fr_2.5rem_auto_2.5rem_1fr] grid-rows-[1fr_auto_1fr]">

    <div class="col-start-3 row-start-2 bg-gray-100 rounded-xl p-8 shadow-lg w-full max-w-md">

        <h1 class="text-3xl font-light text-center mb-6">
            Create an Account
        </h1>

        <form method="POST" action="{% url 'register' %}" class="bg-white rounded-lg shadow-md overflow-hidden">

            {% csrf_token %}

            <div class="h-2 bg-indigo-500"></div>

            <div class="p-8">

                {% if form.errors %}
                <div class="mb-5 rounded-md bg-red-100 border border-red-400 text-red-700 px-4 py-3">
                    {{ form.errors }}
                </div>
                {% endif %}

                <!-- Email -->
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    value="{{ request.POST.email }}"
                    class="w-full border border-gray-300 rounded-md px-3 py-2 mb-5 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >

                <!-- Username -->
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    value="{{ request.POST.username }}"
                    required
                    class="w-full border border-gray-300 rounded-md px-3 py-2 mb-5 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >

                <!-- Password -->
                <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    class="w-full border border-gray-300 rounded-md px-3 py-2 mb-5 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >

                <!-- Confirm Password -->
              <!--  <label class="block text-sm font-semibold text-gray-700 mb-2">
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="password2"
                    placeholder="Confirm your password"
                    required
                    class="w-full border border-gray-300 rounded-md px-3 py-2 mb-6 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                > -->

                <button
                    type="submit"
                    class="w-full bg-indigo-500 text-white py-2 rounded-md hover:bg-indigo-600 transition">
                    Register
                </button>

                <p class="text-center text-sm text-gray-600 mt-6">
                    Already have an account?
                    <a href="{% url 'login' %}" class="text-indigo-600 hover:underline">
                        Login
                    </a>
                </p>

            </div>

        </form>

    </div>

</div>

{% endblock %}
